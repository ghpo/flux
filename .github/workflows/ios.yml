name: iOS

on:
  push:
    branches: [ios, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared:
    runs-on: macos-15
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The whole Gradle build configures :app too, so the Android SDK must be
      # present even though this job only compiles :shared.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the shared JVM tests
        run: ./gradlew :shared:jvmTest --no-daemon
      - name: Compile the shared module for the iOS device
        run: ./gradlew :shared:compileKotlinIosArm64 --no-daemon --stacktrace
      - name: Compile the shared module for the iOS simulator
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --no-daemon --stacktrace
      - name: Run the shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --no-daemon --stacktrace
      - name: Build the iOS app for the simulator
        working-directory: ${{ github.workspace }}
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath iosApp/build/simulator \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
      - name: Build the iOS app for the device (unsigned)
        working-directory: ${{ github.workspace }}
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath iosApp/build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package the unsigned app into an IPA
        working-directory: ${{ github.workspace }}
        run: |
          APP_DIR="iosApp/build/device/Build/Products/Release-iphoneos"
          cd "$APP_DIR"
          mkdir -p Payload
          cp -R Flux.app Payload/
          zip -qry Flux.ipa Payload
      - name: Upload the IPA for sideloading
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: iosApp/build/device/Build/Products/Release-iphoneos/Flux.ipa
          if-no-files-found: error
          retention-days: 7
